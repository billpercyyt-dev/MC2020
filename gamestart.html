	function doKeyDown(event) {
		gUser = 0;
		
		var x = event.which || event.keyCode;
		switch (x) {
			case 37: gUser = 1; break;
			case 38: gUser = 2; break;
			case 39: gUser = 3; break;
			case 40: gUser = 4; break;
			case 67: gUser = 11; break;
			default: gUser = 0; break;
		}
	}

	}
	
	function gameLoop(time) {
		requestAnimationFrame(gameLoop);
	
	    if (gStart === null) {
	        gStart = time;
	    }

	    var elapsed = time - gStart;

	    if ((gApple) && (elapsed < gDelay)) {
	        return;
	    }
	    
		if (++gTock===50){
			gTock=0;
		}
		
 	    if (gTock === 1 || gTock === 25){
	    	if (gStatUD){
	    		if (++gStatVB === 4){
	    			gStatVB=2;
	    			gStatUD=false;
	    		}
	    	} else {
	    		if (--gStatVB === -1){
	    			gStatVB=1;
	    			gStatUD=true;
	    		}
	    	}
	    }
 	    
 	    if (gameOver > 0){
			switch(gameOver){
			case 1:
				clearSound();									
				gAud = document.getElementById('moviestart');
				gAud.play();						
				gameOver = 2;
				doGameOver();						
				break;
			case 2:
				if (gTock % 10 === 0){
					doGameOver();
				}
				gAud.onended = function() {startTheEnd()};
				break;
			case 3:
				gAud = document.getElementById('theend');
				gAud.play();							
				doEnd();
				break;
			case 4:
				document.getElementById('theend').pause();
				offCTxt.fillStyle = 'blue';
				offCTxt.fillRect(50,200, 300, 100);
				offCTxt.font = '30px Arial';
				offCTxt.fillStyle = 'white';
				offCTxt.fillText('PLEASE WAIT', 105,260);
				
				if (window.location.hostname === 'localhost'){
					window.location = ('http://localhost:8080/mc2020congrats.html');
				} else {
					window.location = ('http://mc2020.appspot.com/mc2020congrats.html');
				}

				gameOver = 5;
				break;
			case 5:
				break;
			}
		} else {
			update();
			draw();
		}

		gContext.drawImage(offCanv,0,0);
		
		gStart = time;
	}

	function updateAniVB(blob){
		if (gTock % 10 !== 0){
			return;
		}
		
		if (++gAniVB[blob][2] === 10){
			gAniVB[blob][2] = 0;
		}
		
		if (gAniVB[blob][2] === 5){
			switch (gAniVB[blob][3]){
			case 1:	
				gAniVB[blob][0]--;
				break;
			case 3:	
				gAniVB[blob][0]++;
				break;
			}
		}
		
		if (gAniVB[blob][2] === 0){
			switch (gAniVB[blob][3]){
			case 0:	
				if (gAniVB[blob][1]-- === 0){
					gAniVB[blob][1] = 39;
				}
				break;
			case 1:	
				gAniVB[blob][0]--;
				break;
			case 2:	
				if (gAniVB[blob][1]++ === 39){
					gAniVB[blob][1] = 0;
				}
				break;
			case 3:	
				gAniVB[blob][0]++;
				break;
			}

			var dirs = [0,0,0,0];

			switch(gMap[gAniVB[blob][0]][gAniVB[blob][1]]){
				case -200: dirs = [1,0,1,0]; break;
				case -202: dirs = [1,1,1,0]; break;
				case -204: dirs = [1,0,1,1]; break;
				case -206: dirs = [1,1,1,1]; break;
				case -208: dirs = [0,1,0,1]; break;
				case -210: dirs = [0,1,1,0]; break;
				case -212: dirs = [1,1,0,0]; break;
				case -214: dirs = [0,0,1,1]; break;
				case -216: dirs = [1,0,0,1]; break;
				case -218: dirs = [0,1,0,0]; break;
				case -220: dirs = [0,0,1,0]; break;
				case -222: dirs = [0,0,0,1]; break;
				case -224: dirs = [1,0,0,0]; break;
				case -226: dirs = [0,1,1,1]; break;
				case -228: dirs = [1,1,0,1]; break;					
			}
			
			switch (gAniVB[blob][3]){
			case 0: gAniVB[blob][3] = 3; break;
			case 1: gAniVB[blob][3] = 0; break;
			case 2: gAniVB[blob][3] = 1; break;
			case 3: gAniVB[blob][3] = 2; break;
			}
			
			for (var x=0; x<4; x++){						
				if (dirs[gAniVB[blob][3]] === 1){

	function drawAniVB(blob){		
		var returnFlag = true;	
		var col = scrTLCol;
		var scrCol = 0;
		var upDown = 0;
		var leftRight = 0;
		var itemLeft = 0;
		var itemRight = 0;
		
		for (var x=0; x<3; x++){
			if (col-- === 0){
				col = 39;
			}
		}
		
		for (scrCol=0; scrCol<15; scrCol++){
			if (col++ === 39){		
				col = 0;
			}
			if (gAniVB[blob][1] === col){
				returnFlag = false;
				break;
			}
		}
	
		if (returnFlag){	
			return;
		}

		if (scrCol < 3){
			itemLeft = 3 - scrCol;
		}
		
		if (scrCol > 11){
			itemRight = scrCol - 11;
		}	
	
		scrCol = scrCol - 3;

		var bStage = gAniVB[blob][2];
		if (bStage > 4){
			bStage = bStage - 5;
		}
				
		if (
			((gAniVB[blob][0] === scrTLRow + 13 ||
			   gAniVB[blob][0] === scrTLRow + 14 ||	
			   gAniVB[blob][0] === scrTLRow + 15 ||
			   gAniVB[blob][0] + 1 === scrTLRow + 13) &&
			  
 			  ((gAniVB[blob][2] < 8 && scrCol === 4) ||
		 		(gAniVB[blob][2] > 2 && gAniVB[blob][3] === 2 && scrCol === 3) ||		
    			(gAniVB[blob][2] > 2 && gAniVB[blob][3] === 0 && scrCol === 5))) ||		
			  
     		(gAniVB[blob][0] + 1 === scrTLRow + 12 &&
   			 bStage > 1 && gAniVB[blob][3] === 3 &&											
   			 scrCol === 4) ||
			
			(gAniVB[blob][0] + 1 === scrTLRow + 13 &&
			 gAniVB[blob][3] === 1 &&														
			 scrCol === 4)		
			)
			  
			{	
			document.getElementById('zapped').play();
			setCaughtVB(blob);
		}
	
		switch (gDir){
		case 1:	leftRight = -1 * (gStage * 4); break;
		case 3: leftRight = gStage * 4; break;
		case 2: upDown = gStage * 2; break;
		case 4: upDown = -1 * (gStage * 2); break;
		}
		
		if (gAniVB[blob][0] >= scrTLRow-2 && gAniVB[blob][0] < scrTLRow + 30){
			var coordRow = gAniVB[blob][0] - scrTLRow;
			
			if (itemLeft > 0){
				vbTopL(coordRow * 20 + upDown, itemLeft);
			} else {
				if (itemRight > 0){		
  					vbTopR((10 * 40) - 20, coordRow * 20 + upDown, itemRight);
				} else {
					vbTop((scrCol * 40) + 20 + leftRight, coordRow * 20 + upDown, blob);
				}
			}
		}
		
		if (gAniVB[blob][0]+1 > scrTLRow-2 && gAniVB[blob][0] + 1 < scrTLRow + 30){
			var coordRow = (gAniVB[blob][0] + 1) - scrTLRow;
			
			if (itemLeft > 0){
				vbBotL(coordRow * 20 + upDown, itemLeft);
			} else {
				if (itemRight > 0){		
  					vbBotR((10 * 40) - 20, coordRow * 20 + upDown, itemRight);
				} else {
					vbBot((scrCol * 40) + 20 + leftRight, coordRow * 20 + upDown, blob);
				}
			}
		}
	}
	
	function setCaughtVB(blob){
		if (gAniVB[blob][4] > 0){
			return;
		}
		
		gAniVB[blob][4] = 1;						
		gAniVB[blob][5] = scrTLRow + 14;	
		
		var col = scrTLCol;
		if (col++ === 39){
			col = 0;
		}
		if (col++ === 39){
			col = 0;
		}
		if (col++ === 39){
			col = 0;
		}
		gAniVB[blob][6] = col;						
		
		for (var c=0; c<5; c++){

	function drawPeng(peng){
		var returnFlag = true;	
		var col = scrTLCol;
		var scrCol = 0;
		var upDown = 0;
		var leftRight = 0;	
		var itemLeft = 0;
		var itemRight = 0;
		
		for (var x=0; x<3; x++){
			if (col-- === 0){
				col = 39;
			}
		}
		
		for (scrCol=0; scrCol<15; scrCol++){
			if (col++ === 39){				
				col = 0;
			}
			if (gPeng[peng][1] === col){
				returnFlag = false;
				break;
			}
		}
	
		if (returnFlag){			
			return;
		}
		
		
		if (scrCol < 3){
			itemLeft = 3 - scrCol;
		}
		
		if (scrCol > 11){
			itemRight = scrCol - 11;
		}	
	
		scrCol = scrCol - 3;

		if (
			((gPeng[peng][0] === scrTLRow + 13 ||
			  gPeng[peng][0] === scrTLRow + 14 ||	
			  gPeng[peng][0] === scrTLRow + 15 ||
			  gPeng[peng][0] + 1 === scrTLRow + 13 ||
			  gPeng[peng][0] + 2 === scrTLRow + 13) &&
				  
	 		 ((gPeng[peng][2] < 8 && scrCol === 4) ||
			  (gPeng[peng][2] > 2 && gPeng[peng][3] === 3 && scrCol === 3) ||	
	    	  (gPeng[peng][2] > 2 && gPeng[peng][3] === 1 && scrCol === 5))) ||		
				  
	     	  ((gPeng[peng][0] + 2 === scrTLRow + 12) &&
	     	   (gPeng[peng][2] > 1) && (gPeng[peng][3] === 4) &&								
	   		   scrCol === 4) ||
				
			   (gPeng[peng][0] + 2 === scrTLRow + 13 &&
				gPeng[peng][3] === 2 &&											
				scrCol === 4)
				
				)
				  
				{	
				document.getElementById('zapped').play();
				setCaughtPeng(peng);
			}
		
		switch (gDir){
		case 1:	leftRight = -1 * (gStage * 4); break;
		case 3: leftRight = gStage * 4; break;
		case 2: upDown = gStage * 2; break;
		case 4: upDown = -1 * (gStage * 2); break;
		}

		if (gPeng[peng][0] >= scrTLRow-2 && gPeng[peng][0] < scrTLRow + 30){
			var lRow = gPeng[peng][0] - scrTLRow;
			
			if (itemLeft > 0){
				drawPengTE(0, lRow * 20 + upDown, itemLeft, 0);
			} else {
				if (itemRight > 0){		
  					drawPengTE((10 * 40) - 20, lRow * 20 + upDown, itemRight, 19);
				} else {
					drawPengTop((scrCol * 40) + 20 + leftRight, lRow * 20 + upDown, peng);
				}
			}
		}
		
		if (gPeng[peng][0]+1 > scrTLRow-2 && gPeng[peng][0]+1 < scrTLRow + 30){
			var lRow = (gPeng[peng][0] + 1) - scrTLRow;
			
			if (itemLeft > 0){			
				drawPengME(0, lRow * 20 + upDown, itemLeft, 0);
			} else {
				if (itemRight > 0){		
					drawPengME((10 * 40) - 20, lRow * 20 + upDown, itemRight, 19);
				} else {
					drawPengM((scrCol * 40) + 20 + leftRight, lRow * 20 + upDown, peng);
				}
			}
		}
		
		if (gPeng[peng][0]+2 > scrTLRow-2 && gPeng[peng][0]+2 < scrTLRow + 30){
			var lRow = (gPeng[peng][0] + 2) - scrTLRow;
			
			if (itemLeft > 0){
				drawPengBE(0, lRow * 20 + upDown, itemLeft, 0);
			} else {
				if (itemRight > 0){		
					drawPengBE((10 * 40) - 20, lRow * 20 + upDown, itemRight, 19);
				} else {
					drawPengBot((scrCol * 40) + 20 + leftRight, lRow * 20 + upDown, peng);
				}
			}
		}
	}

	function loadMiniMapRG1(row, col){	
		row = row - 9;						
		for (var c = 0; c < 6; c++){			
			if (--col < 0){				
				col = 39;
			}
		}
		gMiniRG1Row = row - 1;
		gMiniRG1Col = col + 1;

		var rand = Math.floor(Math.random() * 10);
		var x = 0;
		var saveCol = col;
		for (var r = 0; r < 8; r++) {									
			for (var c = 0; c < 8; c++) {
				gMap[row][col] = gMiniMapRG1[rand][x++];
				if (col++ === 39){
					col = 0;
				}
			}
			col = saveCol;
			row++;
		}		
	}
	
	function clearMiniMapRG1(row, col){		
		row = row + 1;						
		for (var c = 0; c < 1; c++){			
			if (--col < 0){				
				col = 39;
			}
		}
		
		var x = 0;
		var saveCol = col;
		for (var r = 0; r < 8; r++) {									
			for (var c = 0; c < 8; c++) {
				gMap[row][col] =-4;			
				if (col++ === 39){
					col = 0;
				}
			}
			col = saveCol;
			row++;
		}		
	}
